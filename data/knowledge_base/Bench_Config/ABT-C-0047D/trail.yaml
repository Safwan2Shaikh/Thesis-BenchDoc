bench:
  id: ABT-C-0047D
  description: RadarECU debugger system bench - RDD_CANoe_v17_MT_FE_005 (RA7)

devices:

  pc:
    type: HostPC
    role:
      - TestExecution
      - Logging
      - Diagnostics
      - DeviceControl
      - BenchControl

  pdu:
    type: PowerDistributionUnit

    outputs:
      port_1:
        powers: psu

      port_2:
        powers: vn5650

      port_3:
        powers: pmb

      port_4:
        powers: lauterbach

  psu:
    type: EA_PS 2342 10-B

    interfaces:
      usb:
        connected_to: pc
        purpose:
          - Control
          - Monitoring
          - Readback

    channels:

      channel_1:
        supplies_pmb_ports:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8

      channel_2:
        supplies_pmb_ports:
          - 9
          - 10
          - 11
          - 12
          - 13
          - 14
          - 15
          - 16

  pmb:
    type: PowerManagementBoard

    ethernet:
      connected_to: netgear_switch

    ports:

      port_1:
        connected_device: ecu_1

      port_2:
        connected_device: null

      port_3:
        connected_device: debugger_mux

      port_4:
        connected_device: ecu_2

      port_5:
        connected_device: null

      port_6:
        connected_device: null

      port_7:
        connected_device: null

      port_8:
        connected_device: null

      port_9:
        connected_device: null

      port_10:
        connected_device: null

      port_11:
        connected_device: null

      port_12:
        connected_device: null

      port_13:
        connected_device: null

      port_14:
        connected_device: null

      port_15:
        connected_device: null

      port_16:
        connected_device: null

  debugger_mux:
    type: LauterbachDebuggerMultiplexer

    power:
      source: pmb.port_3

    purpose: >
      Routes Lauterbach debug interfaces between ECU1 and ECU2
      without requiring manual cable changes.

    switch_positions:

      position_1:
        target: ecu_1

      position_2:
        target: ecu_2

  ecu_1:
    type: RadarECU_FR

    power:
      source: pmb.port_1

    communication:
      can_channel: can13
      ethernet_channel: eth1

  ecu_2:
    type: RadarECU_CR

    power:
      source: pmb.port_4

    communication:
      can_channel: can14
      ethernet_channel: eth2

  vn5650:
    type: Vector_VN5650

    power:
      source: pdu.port_2

    pc_connections:

      ethernet:
        source_port: 1G_front
        destination: pc

      subd9_usb:
        destination: pc

    can_channels:

      can13:
        connected_device: ecu_1

      can14:
        connected_device: ecu_2

    ethernet_channels:

      eth1:
        connected_device: ecu_1

      eth2:
        connected_device: ecu_2

  lauterbach:
    type: Lauterbach

    power:
      source: pdu.port_4

    usb:
      connected_to: pc

    debug_interface:
      connected_to: debugger_mux

  netgear_switch:
    type: EthernetSwitch

    uplink:
      connected_to: pc