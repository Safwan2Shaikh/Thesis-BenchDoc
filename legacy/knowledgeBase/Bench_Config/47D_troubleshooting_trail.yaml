dependencies:

  ecu_1:

    power_chain:
      - pdu.port_1
      - psu.channel_1
      - pmb.port_1

    communication_chain:
      - pc
      - vn5650
      - can13
      - eth1

    debug_chain:
      - pc
      - lauterbach
      - debugger_mux
      - ecu_1

  ecu_2:

    power_chain:
      - pdu.port_1
      - psu.channel_1
      - pmb.port_4

    communication_chain:
      - pc
      - vn5650
      - can14
      - eth2

    debug_chain:
      - pc
      - lauterbach
      - debugger_mux
      - ecu_2

failure_modes:

  pdu_failure:

    symptoms:
      - psu_offline
      - pmb_offline
      - vn5650_offline
      - lauterbach_offline

    affected_devices:
      - psu
      - pmb
      - vn5650
      - lauterbach
      - ecu_1
      - ecu_2

  psu_channel_1_failure:

    symptoms:
      - ecu_1_no_power
      - ecu_2_no_power
      - no_current_consumption

    affected_devices:
      - ecu_1
      - ecu_2
      - debugger_mux

  vn5650_failure:

    symptoms:
      - no_can_communication
      - no_ethernet_communication
      - measurement_unavailable

    affected_devices:
      - ecu_1
      - ecu_2

  lauterbach_failure:

    symptoms:
      - no_debug_access
      - no_trace_data

    affected_devices:
      - ecu_1
      - ecu_2

  debugger_mux_wrong_position:

    symptoms:
      - ecu_not_reachable_by_lauterbach

    checks:
      - verify_mux_position

    affected_devices:
      - ecu_1
      - ecu_2

  netgear_switch_failure:

    symptoms:
      - pmb_unreachable
      - remote_control_unavailable

    affected_devices:
      - pmb

diagnostic_rules:

  - condition: ecu_1_not_reachable

    check_order:
      - pdu
      - psu
      - pmb
      - vn5650
      - ecu_1

  - condition: ecu_2_not_reachable

    check_order:
      - pdu
      - psu
      - pmb
      - vn5650
      - ecu_2

  - condition: lauterbach_cannot_connect_to_ecu_2

    check_order:
      - lauterbach_power
      - lauterbach_usb
      - debugger_mux_position
      - ecu_2_power

  - condition: no_can_communication

    check_order:
      - vn5650_power
      - vn5650_connection_to_pc
      - can_channel_mapping
      - ecu_power